name: Build and Publish db-init

on:
  push:
    branches: [ master,feat/backend-EXERCISES-Update ]
    paths:
      - 'db-init/**'
      - '.github/workflows/db-init-ci.yml'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: dev

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/db-init

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build db-init module
        run: mvn -pl db-init -am -B clean package

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./db-init
          push: true
          tags: |
            ghcr.io/notephil/scholchat-db-init:latest
            ghcr.io/notephil/scholchat-db-init:${{ github.run_number }}
