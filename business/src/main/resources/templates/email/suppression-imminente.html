<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suppression imminente</title>
    <style>
        .content { padding: 20px; }
        .warning { background-color: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 12px; color: #991b1b; }
        .button {
            display: inline-block; padding: 10px 20px; background-color: #dc2626;
            color: white; text-decoration: none; border-radius: 5px; margin-top: 15px; }
        /* ── Charte ScholChat (commune à tous les e-mails) ── */
        .content { padding: 0 !important; background: transparent !important; }
        .content h2, .content h3 { color: #4F46E5; }
        a { color: #4F46E5; }
        .button, a.button, .btn, a.btn {
            display: inline-block; background-color: #4F46E5 !important; color: #ffffff !important;
            padding: 12px 24px; border-radius: 10px; text-decoration: none; font-weight: bold;
        }
    </style>
</head>
<body style="margin:0;padding:0;background-color:#F3F4F6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F3F4F6;">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
                   style="width:100%;max-width:600px;background-color:#FFFFFF;border-radius:16px;overflow:hidden;border:1px solid #E5E7EB;">
                <tr>
                    <td class="email-banner" style="background-color:#4F46E5;background-image:linear-gradient(135deg,#4F46E5 0%,#9333EA 100%);padding:28px 24px 26px;text-align:center;">
                        <div th:replace="~{email/fragments/brand :: logo}"></div>
                        <h1 style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:22px;line-height:1.35;font-weight:bold;color:#FFFFFF;">⚠️ Suppression imminente</h1>
                    </td>
                </tr>
                <tr>
                    <td class="email-body" style="padding:28px 32px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#1F2937;">

    <div class="content">
        <p>Bonjour,</p>
        <p>L'offre <strong th:text="${offreNom}"></strong> de <strong th:text="${nomCible}"></strong> est expirée
            et n'a pas été renouvelée.</p>
        <div class="warning">
            <p>Sans renouvellement, <strong th:text="${nomCible}"></strong> sera <strong>définitivement supprimé(e)</strong>
                le <strong th:text="${#temporals.format(dateSuppressionPrevue, 'dd/MM/yyyy à HH:mm z')}"></strong>.
                Cette action sera irréversible.</p>
        </div>
        <p>Renouvelez dès maintenant pour éviter la suppression :</p>
        <a class="button" th:href="${renewalUrl}">Renouveler maintenant</a>
    </div>
                    </td>
                </tr>
                <tr>
                    <td th:replace="~{email/fragments/brand :: pied}"></td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
