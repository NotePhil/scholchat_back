spring.profiles.active=h2

# Date/time: the server works in UTC (JVM default zone is forced to UTC in
# BusinessApplication). Timestamps are written/read to/from the database as UTC
# and serialized as ISO-8601 instants ("...Z") by config.time.UtcDateTimeModule.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
# Zone used to render dates in e-mails and for wall-clock scheduled jobs.
app.display-timezone=${APP_DISPLAY_TIMEZONE:Africa/Douala}
